[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "nailong-naiwa-classifier"
version = "0.1.0"
description = "CNN classifier with Feishu and QQ bot adapters for Nailong and Naiwa images"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
  "httpx>=0.27,<1",
  "imagecodecs>=2025.3.30",
  "lark-channel-sdk>=1.1.0",
  "numpy>=2.0",
  "pillow>=11.0",
  "scikit-learn>=1.6",
  "timm==1.0.22",
  "safetensors==0.6.2",
  "huggingface-hub==0.36.0",
  "starlette>=0.48,<1",
  "torch>=2.6",
  "torchvision>=0.21",
  "uvicorn>=0.35,<1",
  "websockets>=15,<16",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "ruff>=0.9",
]

[project.scripts]
nailong-train = "nailong_classifier.train:main"
nailong-doubao-train = "nailong_classifier.train_doubao:main"
nailong-evaluate = "nailong_classifier.evaluate:main"
nailong-predict = "nailong_classifier.predict:main"
nailong-hdr = "nailong_classifier.hdr:main"
nailong-bot = "nailong_classifier.bot:main"
nailong-seed = "nailong_classifier.seed:main"
nailong-web = "nailong_classifier.web:main"

[tool.hatch.build.targets.wheel]
packages = ["src/nailong_classifier"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
